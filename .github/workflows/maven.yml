jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      build_number_output: ${{ steps.generate_number.outputs.build_number }} # Define the output
    steps:
      - name: Generate build number
        id: generate_number
        # Use a third-party action or custom script to generate and set an output if needed for specific formats
        run: echo "::set-output name=build_number::${{ github.run_number }}"
        # Note: set-output is deprecated, use environment files instead for newer GitHub Actions
  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Use the build number from job1
        run: echo "Build number from job1 is ${{ needs.job1.outputs.build_number_output }}"
